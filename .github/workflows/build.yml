name: Build D.A AURA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (VST3)
            os: windows-latest
            artifact: DA-AURA-Windows-x64-Installer
            configure: cmake -B build -A x64
          - name: macOS Universal (AU + VST3)
            os: macos-latest
            artifact: DA-AURA-macOS-AU-VST3
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect plugins (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging package
          find build -path "*_artefacts*" -type d -name "*.vst3" -prune -exec cp -R {} staging/ \;
          test -d "staging/D.A AURA.vst3"

      - name: Test installer payload generation
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v

      - name: Build self-contained Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Invoke-Checked {
            param([string]$Command, [string[]]$Arguments)
            $log = & $Command @Arguments 2>&1 | Tee-Object -Variable captured
            $code = $LASTEXITCODE
            $log | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $captured | Select-Object -Last 20 | ForEach-Object { Write-Output "::error::$($_.ToString())" }
              throw "$Command failed with exit code $code"
            }
          }
          Invoke-Checked python @('Installer/generate_payload.py', '--bundle', 'staging/D.A AURA.vst3', '--output', 'build/installer-payload', '--artwork', 'Installer/welcome.png', '--manifest', 'Installer/installer.manifest')
          Invoke-Checked cmake @('-S', 'Installer', '-B', 'build-installer', '-A', 'x64', "-DPAYLOAD_DIR=$pwd/build/installer-payload")
          Invoke-Checked cmake @('--build', 'build-installer', '--config', 'Release', '--parallel', '4')
          Copy-Item 'build-installer/Release/D.A AURA Installer.exe' package/
          # The copied EXE must carry every plugin file without staging beside it.
          $isolated = Join-Path $env:RUNNER_TEMP 'aura-installer-test'
          New-Item -ItemType Directory -Force $isolated | Out-Null
          Copy-Item 'package/D.A AURA Installer.exe' $isolated
          $test = Start-Process -FilePath (Join-Path $isolated 'D.A AURA Installer.exe') -ArgumentList '--verify-payload' -WorkingDirectory $isolated -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Embedded installer payload verification failed' }
          python Installer/verify_payload.py (Join-Path $isolated 'D.A AURA Installer.exe') 'staging/D.A AURA.vst3'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect plugins (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging package
          find build -path "*_artefacts*" -type d \( -name "*.vst3" -o -name "*.component" \) -prune -exec cp -R {} staging/ \;
          ls -la staging
          test -n "$(ls -A staging)"
          # ad-hoc sign so the bundles load on Apple Silicon
          for b in staging/*; do codesign --force --deep --sign - "$b"; done
          # zip here so bundle permissions survive the artifact upload
          ditto -c -k staging "package/DA-AURA-macOS.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package
          if-no-files-found: error
